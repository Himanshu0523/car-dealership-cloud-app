{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Create an account</h3>
        <form method="post" action="{% url 'djangoapp:register' %}">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="firstName">First name</label>
              <input class="form-control" id="firstName" name="firstName" autocomplete="given-name" placeholder="Enter first name" title="First name">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="lastName">Last name</label>
              <input class="form-control" id="lastName" name="lastName" autocomplete="family-name" placeholder="Enter last name" title="Last name">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" name="email" autocomplete="email" placeholder="Enter email" title="Email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-username">Username</label>
            <input class="form-control" id="reg-username" name="username" autocomplete="username" placeholder="Choose a username" title="Username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-control" id="reg-password" type="password" name="password" autocomplete="new-password" placeholder="Choose a password" title="Password" required>
          </div>
          <button type="submit" class="btn btn-success w-100" title="Register">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
