{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Login</h3>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{% url 'djangoapp:login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" placeholder="Enter username" title="Username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter password" title="Password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" title="Sign in">Sign in</button>
        </form>
        <p class="mt-3 mb-0 text-center small">
          No account? <a href="{% url 'djangoapp:register' %}">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
