{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<h1>Contact Us</h1>
<div class="row mt-4">
  <div class="col-md-6">
    <ul class="list-unstyled fs-5">
      <li class="mb-2"><i class="bi bi-geo-alt-fill text-primary"></i> 123 Main Street, Austin, TX 78701</li>
      <li class="mb-2"><i class="bi bi-telephone-fill text-primary"></i> +1 (512) 555-0100</li>
      <li class="mb-2"><i class="bi bi-envelope-fill text-primary"></i> support@bestcars.example</li>
      <li class="mb-2"><i class="bi bi-clock-fill text-primary"></i> Mon–Sat, 9:00 – 19:00</li>
    </ul>
  </div>
  <div class="col-md-6">
    <form onsubmit="event.preventDefault(); alert('Thanks! We will get back to you.');">
      <div class="mb-3">
        <label for="contact-name" class="form-label">Your name</label>
        <input class="form-control" id="contact-name" name="name" placeholder="Your name" title="Your name" required>
      </div>
      <div class="mb-3">
        <label for="contact-email" class="form-label">Email</label>
        <input class="form-control" id="contact-email" type="email" name="email" placeholder="Email" title="Email" required>
      </div>
      <div class="mb-3">
        <label for="contact-message" class="form-label">Message</label>
        <textarea class="form-control" id="contact-message" name="message" rows="4" placeholder="Message" title="Message" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" title="Send message">Send</button>
    </form>
  </div>
</div>
{% endblock %}
