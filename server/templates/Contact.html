{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<h1>Contact Us</h1>
<div class="row mt-4">
  <div class="col-md-6">
    <ul class="list-unstyled fs-5">
      <li class="mb-2"><i class="bi bi-geo-alt-fill text-primary"></i> 123 Main Street, Austin, TX 78701</li>
      <li class="mb-2"><i class="bi bi-telephone-fill text-primary"></i> +1 (512) 555-0100</li>
      <li class="mb-2"><i class="bi bi-envelope-fill text-primary"></i> support@bestcars.example</li>
      <li class="mb-2"><i class="bi bi-clock-fill text-primary"></i> Mon–Sat, 9:00 – 19:00</li>
    </ul>
  </div>
  <div class="col-md-6">
    <form onsubmit="event.preventDefault(); alert('Thanks! We will get back to you.');">
      <div class="mb-3"><input class="form-control" placeholder="Your name" required></div>
      <div class="mb-3"><input class="form-control" type="email" placeholder="Email" required></div>
      <div class="mb-3"><textarea class="form-control" rows="4" placeholder="Message" required></textarea></div>
      <button class="btn btn-primary">Send</button>
    </form>
  </div>
</div>
{% endblock %}
