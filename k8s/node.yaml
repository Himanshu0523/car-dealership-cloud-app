apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: dealership-api }
  template:
    metadata:
      labels: { app: dealership-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO/bestcars-database:latest
          ports:
            - containerPort: 3030
          env:
            - name: PORT
              value: "3030"
            - name: MONGO_URL
              value: "mongodb://mongo:27017/dealership"
          readinessProbe:
            httpGet: { path: /health, port: 3030 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api
spec:
  selector: { app: dealership-api }
  ports:
    - port: 3030
      targetPort: 3030
